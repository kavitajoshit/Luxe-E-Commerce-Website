<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your LUXE account.">
  <meta name="theme-color" content="#5b3df5">
  <title>Sign In — LUXE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">
  <div class="page-loader" id="page-loader"><div class="loader-ring"></div></div>
  <div id="navbar-root"></div>

  <main>
    <div class="auth-wrap">
      <aside class="auth-visual">
        <a class="brand" href="index.html" style="color:#fff;margin-bottom:32px"><span class="brand-mark"><i class="fa-solid fa-gem"></i></span> LUXE</a>
        <h2>Welcome back.</h2>
        <p>Sign in to track orders, save favourites and check out faster.</p>
        <ul>
          <li><i class="fa-solid fa-check"></i> Faster, one-click checkout</li>
          <li><i class="fa-solid fa-check"></i> Order tracking & history</li>
          <li><i class="fa-solid fa-check"></i> Exclusive member-only deals</li>
          <li><i class="fa-solid fa-check"></i> Synced wishlist across devices</li>
        </ul>
      </aside>

      <div class="auth-form-wrap">
        <div class="auth-card">
          <h1>Sign in</h1>
          <p>New to LUXE? <a href="register.html" style="color:var(--color-primary);font-weight:600">Create an account</a></p>

          <form data-validate="login" novalidate>
            <div class="field"><label>Email <span class="req">*</span></label><input name="email" type="email" data-rules="required|email" placeholder="you@example.com"></div>
            <div class="field">
              <label>Password <span class="req">*</span></label>
              <div class="input-group"><input name="password" type="password" data-rules="required|min:6" placeholder="••••••••"><button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
              <label class="checkbox"><input type="checkbox" name="remember"> Remember me</label>
              <a href="#" style="color:var(--color-primary);font-size:.9rem;font-weight:600">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Sign In</button>
          </form>

          <div class="auth-divider">or continue with</div>
          <div class="social-auth">
            <button class="btn btn-outline"><i class="fa-brands fa-google"></i> Google</button>
            <button class="btn btn-outline"><i class="fa-brands fa-apple"></i> Apple</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>
  <script src="js/utils.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
