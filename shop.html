<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop all LUXE products — filter by category, price and rating. Premium audio, wearables, computing and more.">
  <meta name="theme-color" content="#5b3df5">
  <title>Shop — LUXE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="shop">
  <div class="page-loader" id="page-loader"><div class="loader-ring"></div></div>
  <div id="navbar-root"></div>

  <header class="page-head">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><span>Shop</span>
      </nav>
      <h1>All Products</h1>
      <p>Explore our full catalogue of premium tech & lifestyle gear.</p>
    </div>
  </header>

  <main class="section-sm">
    <div class="container">
      <div class="shop-layout">
        <!-- Sidebar filter -->
        <div class="filter-backdrop" id="filter-backdrop"></div>
        <aside class="filter-sidebar" id="filter-sidebar">
          <div class="drawer-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <h3 style="margin:0">Filters</h3>
            <button class="icon-btn filter-toggle-mobile" id="filter-close" aria-label="Close filters"><i class="fa-solid fa-xmark"></i></button>
          </div>

          <div class="filter-group">
            <h4>Category</h4>
            <div id="filter-cats"></div>
          </div>

          <div class="filter-group">
            <h4>Max Price</h4>
            <input type="range" id="price-range" min="20" max="1500" value="1500" step="10">
            <div class="price-range"><span style="font-size:.85rem;color:var(--color-text-mute)">Up to</span> <strong id="price-label">$1,500.00</strong></div>
          </div>

          <div class="filter-group">
            <h4>Rating</h4>
            <label class="filter-option"><input type="radio" name="rating-filter" value="0" checked> All ratings</label>
            <label class="filter-option"><input type="radio" name="rating-filter" value="4"> <span class="stars">★★★★</span> 4 & up</label>
            <label class="filter-option"><input type="radio" name="rating-filter" value="4.5"> <span class="stars">★★★★★</span> 4.5 & up</label>
            <label class="filter-option"><input type="radio" name="rating-filter" value="5"> <span class="stars">★★★★★</span> 5 only</label>
          </div>

          <a href="shop.html" class="btn btn-ghost btn-block btn-sm"><i class="fa-solid fa-rotate"></i> Reset filters</a>
        </aside>

        <!-- Product area -->
        <div>
          <div class="shop-toolbar">
            <button class="btn btn-outline btn-sm filter-toggle-mobile" id="filter-toggle"><i class="fa-solid fa-sliders"></i> Filters</button>
            <div class="shop-search">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input class="input" id="shop-search-input" type="search" placeholder="Search products…" aria-label="Search products">
            </div>
            <span class="result-count" id="result-count"></span>
            <select class="sort-select" id="sort-select" aria-label="Sort by">
              <option value="popular">Sort: Popularity</option>
              <option value="newest">Sort: Newest</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="rating">Sort: Top Rated</option>
            </select>
          </div>

          <div class="products-grid" id="shop-grid"></div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>
  <script src="js/utils.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
